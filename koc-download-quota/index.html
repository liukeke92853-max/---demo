<main><section class="filter"><div class="tabs" id="tabs" aria-label="授权流程状态"></div><form id="filters"><label class="date"><span id="date-label">合作时间</span> <input aria-label="合作开始日期" id="start" type="date"><span>—</span><input aria-label="合作结束日期" id="end" type="date"></label><label>KOC信息 <input id="koc" placeholder="KOC昵称／抖音号"></label><label>IP信息 <select id="ip"><option value="">全部IP</option><option>SYQ雅乔</option><option>大码胖佳佳</option><option>老马Marius</option><option>Dancy丹姐</option></select></label><label>所属导师 <select id="mentor"><option value="">全部导师</option><option>绿豆</option><option>梅子</option></select></label><div class="query"><span id="filter-error" role="alert"></span><button type="button" id="clear">重置</button><button class="primary">查询</button></div></form></section>
<section class="listing"><div class="list-head"><b>数据列表</b><span class="subtle">共 <span id="count">7</span> 条</span><button id="open-all-records" class="all-records-button">全部追加记录 <span class="new">新增</span></button></div><div class="table-scroll"><table class="business"><thead><tr><th>KOC信息</th><th>IP信息</th><th>所属导师</th><th>渠道信息</th><th>渠道类型</th><th>分成比例</th><th>素材下载额度 <span class="change">改造</span> <button id="quota-help" class="help" type="button" aria-label="素材下载额度统计说明" aria-describedby="quota-help-content" aria-expanded="false">?</button></th><th>绑定期限</th><th class="sticky">操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagination"><span>共 <span id="count-bottom">7</span> 条</span><button disabled>‹</button><button class="page-current">1</button><select aria-label="每页条数"><option>20条／页</option></select></div></section></main></div>
<dialog id="quota-dialog" aria-labelledby="quota-title"><form id="quota-form" novalidate><div class="modal-head"><h2 id="quota-title">新增素材下载额度 <span class="new">新增</span></h2><button type="button" class="close" data-close aria-label="关闭弹窗">×</button></div><div class="modal-body"><div id="identity"></div><div class="notice">本次追加供该机构在此IP下的全部KOC共享使用。</div><div id="quota-summary"></div><div class="add-fields"><fieldset class="period-field"><legend>追加周期 <span class="new">新增</span></legend><div class="period-options"><label><input type="radio" name="period" value="day" checked>今日</label><label><input type="radio" name="period" value="month">当月</label></div></fieldset><label class="amount-field" for="amount-add">新增分钟数 <span class="new">新增</span></label><div class="number-wrap"><input id="amount-add" type="number" min="1" step="1" placeholder="请输入追加分钟数" inputmode="numeric"><span>分钟</span></div><small id="amount-preview"></small><small id="amount-hint"></small></div><div id="error" class="error" role="alert"></div><button type="button" id="expand-records" class="link">查看追加记录 <span class="new">新增</span></button><div id="inline-records" hidden></div></div><div class="modal-footer"><button type="button" data-close>取消</button><button id="save" class="primary">确认新增 <span class="new inverse">新增</span></button></div></form></dialog>
