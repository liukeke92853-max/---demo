<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="demo-release" content="20261105-28a111d1d2"><meta name="viewport" content="width=device-width,initial-scale=1"><title>推广位管理 · 渠道端</title><link rel="stylesheet" href="样式.css?v=20261105-28a111d1d2"></head>
<body>
<header class="app-header"><div class="brand"><svg viewBox="0 0 32 40" aria-hidden="true"><path fill="#2b61ff" d="M15 0c14 1 18 15 11 28-3 6-8 10-15 10 8-5 9-15 4-19z"/><path fill="#00c6ec" d="M14 14C-2 13-3 35 12 38 5 31 7 23 14 23z"/></svg><b>抖老板切片</b><span>渠道端</span></div><div class="account" title="当前渠道：AB 机构" aria-label="当前渠道 AB 机构"></div></header>
<nav class="sidebar" aria-label="渠道端导航"><div class="nav-item"><span class="nav-icon">▤</span>订单明细</div><div class="nav-item"><span class="nav-icon">♡</span>邀约管理<span class="chevron">⌃</span></div><div class="nav-child">邀约列表</div><div class="nav-child">账号列表</div><div class="nav-item selected" aria-current="page"><span class="nav-icon ad-icon">AD</span>推广位管理</div><div class="nav-item"><span class="nav-icon">♙</span>IP列表</div></nav>
<div class="content">
<div class="reviewbar"><span>需求演示</span><div><button id="demoView" class="active">交互演示</button><button id="prdView">完整增量 PRD</button><button id="showPhone">邀请通知</button><button id="reset">重置演示</button></div></div>
<main id="demo">
<section class="panel filter-panel"><div class="heading"><h2>筛选</h2><button class="reset-link" id="resetFilters" data-review-change="reset-filter">♧ 重置</button></div><div class="filters"><div class="filter-control date-control"><span>创建时间：</span><input id="startDate" type="date" aria-label="开始日期"><span>－</span><input id="endDate" type="date" aria-label="结束日期"></div><label class="filter-control"><span>推广位：</span><input id="search" placeholder="请输入用户名/ID"></label><label class="filter-control"><span>推广位等级：</span><select id="level"><option value="">请选择</option><option value="1">一级</option><option value="2">二级</option></select></label><label class="filter-control"><span data-review-change="status-filter">合作状态：</span><select id="status"><option value="all">全部</option><option value="working">合作中</option><option value="pending">待接受</option><option value="closed">已关闭</option><option value="declined">已拒绝</option></select></label></div><div id="filterError" class="filter-error" role="status"></div></section>
<section class="panel management"><div class="heading"><h2>数据列表</h2><button class="primary" id="create" data-review-change="create-slot">新增推广位</button></div><div class="tablewrap"><table class="slot-table"><thead><tr><th>推广位</th><th>推广位等级</th><th>分成比例</th><th>关联上级</th><th>上级分成比例</th><th>创建时间</th><th data-review-change="status-column">合作状态</th><th class="operation">操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="list-footer"><span id="resultCount"></span><span>第 1 页</span></div></section>

<section class="panel prd"><div class="heading"><h2>当前页面 · 增量 PRD</h2></div><div id="pagePrd"></div></section>
</main>
<main id="fullPrd" hidden><section class="panel prd"><h2>渠道推广位邀请与关闭 · 完整增量 PRD</h2><p class="muted">2026-11-04 · V1.5</p><div id="prdContent"></div></section></main>

</div>
<dialog id="phoneDrawer" class="phone-drawer"><div class="drawer-heading"><h2>邀请通知</h2><button id="closePhone" aria-label="关闭邀请演示">×</button></div><div class="phone-controls"><label class="muted" for="recipient">查看机构</label><select id="recipient"></select><div class="entry-switch"><button id="officialScene" class="active">公众号通知</button><button id="businessScene">直接进入切片业务</button></div></div><section class="phone"><div class="statusbar">9:41 <span>● ● ▰</span></div><div class="phonehead" id="phoneHead">公众号</div><div class="phonebody" id="phoneContent"></div></section></dialog>
<dialog id="logDialog" class="log-dialog"><div class="drawer-heading"><h2 id="logTitle" data-review-change="logs">操作日志</h2><button id="closeLogs" aria-label="关闭日志">×</button></div><div class="tablewrap"><table><thead><tr><th>操作时间</th><th>操作人</th><th>操作</th><th>操作内容</th></tr></thead><tbody id="logs"></tbody></table></div></dialog>
<dialog id="modal"><div id="modalContent"></div></dialog><div id="toast" role="status"></div><script src="需求说明.js?v=20261105-28a111d1d2"></script><script src="交互.js?v=20261105-28a111d1d2"></script></body></html>
