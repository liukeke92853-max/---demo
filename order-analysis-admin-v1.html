<section class="card prd" id="prd"><div class="section-head"><div><h2>业管订单分析 · 页面级PRD</h2><p>V1.0 · 2026-11-04 · 本轮构思，待评审</p></div><span class="proposal">建议方案</span></div><div id="prd-content"></div></section></main></div><script>'use strict';
// 此文件仅生成订单分析交互原型数据，不来自真实订单，不提供真实业绩判断。
// 日期是北京时间的自然日；生产数据及金额口径沿用两端已确认的订单定义。
const analysisFixture={lastDay:'2026-11-03',firstDay:'2025-10-01',ips:['潘生精选','金子 so much','知久'],channels:[{id:1,name:'星禾渠道'},{id:2,name:'远山渠道'}],slots:[{id:1001,name:'云朵推广',type:'first',parent:0,rate:30},{id:1002,name:'青禾推广',type:'first',parent:0,rate:20},{id:2001,name:'小鹿工作室',type:'second',parent:1002,rate:30},{id:2002,name:'米粒工作室',type:'second',parent:1001,rate:20},{id:2003,name:'星点工作室',type:'second',parent:1002,rate:25}]};
const analysisDaily=[];
(()=>{
 const dayMs=86400000,start=Date.parse(analysisFixture.firstDay+'T00:00:00Z'),last=Date.parse(analysisFixture.lastDay+'T00:00:00Z');
 const streams=[{channel:0,source:'platform',slot:0},{channel:1,source:'direct',slot:0},{channel:1,source:'first',slot:1001},{channel:1,source:'first',slot:1002},{channel:1,source:'second',slot:2001},{channel:1,source:'second',slot:2002},{channel:1,source:'second',slot:2003},{channel:2,source:'direct',slot:0}];
 for(let ms=start,index=0;ms<=last;ms+=dayMs,index++){
  const date=new Date(ms).toISOString().slice(0,10),age=Math.round((last-ms)/dayMs);
  streams.forEach((stream,j)=>{
   const wave=Math.sin(index*.52+j)*6+Math.cos(index*.18-j)*4,orders=Math.max(0,Math.round(20+j*3+index*.025+wave));
   const refunds=(index+j)%8===0?Math.min(orders,3):Math.min(orders,(index+j)%3),valid=orders-refunds;
   const settled=Math.floor(valid*Math.min(1,Math.max(0,age/10))),price=10900+j*1100;
   const base=orders*price,pay=orders*(price-180-(j%3)*100);
   const phases={};
   for(const [phase,count] of [['est',orders],['valid',valid],['real',settled]]){
    const org=count*price*420,fee=stream.channel?count*price*160:0;
    phases[phase]=Object.freeze({org,fee,net:org-fee});
   }
   const fee=phases.valid.fee,slot=analysisFixture.slots.find(s=>s.id===stream.slot),parent=analysisFixture.slots.find(s=>s.id===slot?.parent),ownSlot=slot?fee*slot.rate/100:0,ownParent=parent?fee*parent.rate/100:0;
   const incomeByCompany={};
   if(stream.channel){incomeByCompany[stream.channel]=Object.freeze({total:fee,own:fee-ownSlot-ownParent});if(slot)incomeByCompany[slot.id]=Object.freeze({total:ownSlot,own:ownSlot});if(parent)incomeByCompany[parent.id]=Object.freeze({total:ownSlot+ownParent,own:ownParent});}
   analysisDaily.push(Object.freeze({date,channel:stream.channel,source:stream.source,slot:stream.slot,ip:analysisFixture.ips[(index+j)%analysisFixture.ips.length],orders,valid,base,pay,phases:Object.freeze(phases),incomeByCompany:Object.freeze(incomeByCompany)}));
  });
 }
})();
</script><script>'use strict';
const $=s=>document.querySelector(s),mode=document.body.dataset.mode,DAY=86400000;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roleDefs={channel:{company:1,name:'星禾渠道',title:'渠道'},first:{company:1002,name:'青禾推广',title:'一级推广位'},second:{company:2001,name:'小鹿工作室',title:'二级推广位'}};
let role='channel',selectedMetric=mode==='admin'?'orgNet':'own',model=null,pointIndex=0;
const asMs=s=>Date.parse(s+'T00:00:00Z'),iso=ms=>new Date(ms).toISOString().slice(0,10),shift=(s,n)=>iso(asMs(s)+n*DAY),short=s=>s.slice(5).replace('-','.');
function compareRange(start,end){const count=Math.round((asMs(end)-asMs(start))/DAY)+1;return{start,end,count,prevStart:shift(start,-count),prevEnd:shift(start,-1)};}
function dateList(start,end){const out=[];for(let t=asMs(start);t<=asMs(end);t+=DAY)out.push(iso(t));return out;}
function metricDefs(){return mode==='admin'?[{key:'sales',name:'销售额',unit:'元'},{key:'orders',name:'订单数',unit:'单'},{key:'org',name:'机构收入',unit:'元'},{key:'fee',name:'渠道提成',unit:'元'},{key:'orgNet',name:'机构净收入',unit:'元'}]:[{key:'sales',name:'销售额',unit:'元'},{key:'validSales',name:'有效销售额',unit:'元'},{key:'orders',name:'总订单数',unit:'单'},{key:'validOrders',name:'有效订单数',unit:'单'},{key:'total',name:'预估总收益',unit:'元'},{key:'own',name:'预估净收益',unit:'元'}];}
const orgIncomeExplanation='机构收入已扣除达人所得，尚未扣除渠道提成。减去渠道提成后，即为机构净收入。';
function incomeHelp(d){return mode==='admin'&&d.key==='org'?'<span class="analysis-income-help" tabindex="0" aria-label="机构收入计算说明" data-income-help="true">?</span>':'';}
function selectedDef(){return metricDefs().find(d=>d.key===selectedMetric);}
function money(n){return(n/1000000).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function valueText(n,d){return d.unit==='单'?n.toLocaleString('zh-CN'):money(n);}
function accessible(r){return mode==='admin'||Object.hasOwn(r.incomeByCompany,roleDefs[role].company);}
function sourceKey(r){return mode==='admin'?(r.channel?'channel':'platform'):r.source;}
function sourceLabels(){return mode==='admin'?{platform:'平台达人',channel:'渠道达人'}:role==='first'?{first:'本级推广位',second:'下属二级推广位'}:role==='second'?{second:'本级推广位'}:{direct:'本渠道',first:'一级推广位',second:'二级推广位'};}
function metricValue(r,key,phase){
 switch(key){
 case'sales':return(mode==='admin'?r.pay:r.base)*10000;
 case'validSales':return r.orders?r.base*r.valid/r.orders*10000:0;
 case'orders':return r.orders;
 case'validOrders':return r.valid;
 case'org':return r.phases[phase].org;
 case'fee':return r.phases[phase].fee;
 case'orgNet':return r.phases[phase].net;
 case'total':case'own':return r.incomeByCompany[roleDefs[role].company]?.[key]??0;
 default:throw new Error('未知指标');
 }
}
function delta(current,previous){const amount=current-previous;return{amount,percent:previous===0?(current===0?0:null):amount/Math.abs(previous)*100};}
function changeText(current,previous){const d=delta(current,previous);return d.percent===null?'—':(d.percent>0?'+':'')+d.percent.toFixed(2)+'%';}
function changeClass(current,previous){return current>previous?'up':current<previous?'down':'flat';}
function metricTitle(d){if(mode!=='admin'||!['org','fee','orgNet'].includes(d.key))return d.name;const phase={est:'预估',valid:'有效预估',real:'结算'}[model.phase];return{org:'机构'+phase+'收入',fee:'渠道'+phase+'提成',orgNet:'机构'+phase+'净收入'}[d.key];}
function total(rows,key,phase=model.phase){return rows.reduce((s,r)=>s+metricValue(r,key,phase),0);}
function queryModel(){
 const start=$('#start').value,end=$('#end').value;if(!start||!end||start>end)throw new Error('请选择完整日期，开始日期不能晚于结束日期。');
 const range=compareRange(start,end);
 if(range.count>90)throw new Error('单次查询请选择90天以内的区间。');
 if(end>analysisFixture.lastDay||range.prevStart<analysisFixture.firstDay)throw new Error('请选择具备本期及上期数据的日期范围。');
 const source=$('#source').value,ip=$('#ip').value,channel=$('#channel')?.value||'',slot=$('#slot')?.value||'';
 const scope=analysisDaily.filter(r=>accessible(r)&&(!source||sourceKey(r)===source)&&(!ip||r.ip===ip)&&(!channel||r.channel===Number(channel))&&(!slot||r.slot===Number(slot)));
 return{...range,phase:$('#phase')?.value||'valid',scope,current:scope.filter(r=>r.date>=start&&r.date<=end),previous:scope.filter(r=>r.date>=range.prevStart&&r.date<=range.prevEnd)};
}
function apply(){try{const next=queryModel();model=next;$('#error').textContent='';render();}catch(e){$('#error').textContent=e.message;}}
function renderCards(){const defs=metricDefs();$('#metrics').classList.toggle('six',defs.length===6);$('#metrics').innerHTML=defs.map(d=>{const current=total(model.current,d.key),previous=total(model.previous,d.key);return'<button class="metric-card '+(selectedMetric===d.key?'active':'')+'" data-metric="'+d.key+'" aria-pressed="'+(selectedMetric===d.key)+'"><label>'+metricTitle(d)+incomeHelp(d)+'</label><strong>'+valueText(current,d)+'</strong><span class="prior">上期 '+valueText(previous,d)+'</span><span class="change '+changeClass(current,previous)+'">环比 '+changeText(current,previous)+'</span></button>';}).join('');}
function series(){const d=selectedDef(),current=dateList(model.start,model.end),previous=dateList(model.prevStart,model.prevEnd),sums=new Map();for(const r of [...model.current,...model.previous])sums.set(r.date,(sums.get(r.date)||0)+metricValue(r,d.key,model.phase));return current.map((date,i)=>({date,prevDate:previous[i],current:sums.get(date)||0,previous:sums.get(previous[i])||0}));}
let plotted=[];
function renderChart(){
 const d=selectedDef();plotted=series();pointIndex=Math.min(pointIndex,plotted.length-1);
 $('#chart-title').innerHTML=esc(metricTitle(d)+'趋势')+incomeHelp(d);$('#chart-subtitle').textContent='按日对齐 · '+model.count+'天对比 · 单位：'+d.unit;
 const left=72,right=1010,top=24,bottom=297,width=right-left,height=bottom-top;
 const rawMax=Math.max(...plotted.flatMap(p=>[p.current,p.previous]),0),max=rawMax?rawMax*1.16:(d.unit==='元'?1000000:4);
 const x=i=>plotted.length===1?(left+right)/2:left+i*width/(plotted.length-1),y=v=>bottom-v/max*height;
 plotted=plotted.map((p,i)=>({...p,x:x(i),cy:y(p.current),py:y(p.previous)}));
 const axisValue=v=>{const n=d.unit==='元'?v/1000000:v;return n>=10000?(n/10000).toFixed(1)+'万':n>=1000?Math.round(n).toLocaleString('zh-CN'):n.toFixed(d.unit==='元'&&n<10?2:0);};
 let content='<title>'+esc(metricTitle(d))+'本期与上期每日趋势</title>';
 for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);content+='<line class="chart-grid" x1="'+left+'" x2="'+right+'" y1="'+yy+'" y2="'+yy+'"/><text class="chart-axis" x="'+(left-13)+'" y="'+(yy+4)+'" text-anchor="end">'+axisValue(v)+'</text>';}
 const tickStep=Math.max(1,Math.ceil(plotted.length/7));plotted.forEach((p,i)=>{if(i%tickStep===0||i===plotted.length-1)content+='<text class="chart-axis" x="'+p.x+'" y="327" text-anchor="middle">'+short(p.date)+'</text>';});
 const path=field=>plotted.map((p,i)=>(i?'L':'M')+p.x+','+p[field]).join(' ');
 content+='<path class="chart-previous" d="'+path('py')+'"/><path class="chart-current" d="'+path('cy')+'"/>';
 content+='<line id="point-guide" class="chart-guide" y1="'+top+'" y2="'+bottom+'"/><circle id="point-prev" r="4" fill="#96a6bf" stroke="white" stroke-width="2"/><circle id="point-now" r="5" fill="#2b61ff" stroke="white" stroke-width="2"/>';
 const hitWidth=plotted.length===1?width:width/(plotted.length-1);plotted.forEach((p,i)=>{const l=Math.max(left,p.x-hitWidth/2),r=Math.min(right,p.x+hitWidth/2);content+='<rect class="chart-hit" data-index="'+i+'" tabindex="0" role="button" aria-label="'+p.date+'，本期'+valueText(p.current,d)+d.unit+'，上期'+p.prevDate+' '+valueText(p.previous,d)+d.unit+'" x="'+l+'" y="'+top+'" width="'+(r-l)+'" height="'+height+'"/>';});
 $('#chart').innerHTML=content;showPoint(pointIndex);
}
function showPoint(index){pointIndex=index;const p=plotted[index];if(!p)return;const d=selectedDef();$('#point-guide').setAttribute('x1',p.x);$('#point-guide').setAttribute('x2',p.x);$('#point-now').setAttribute('cx',p.x);$('#point-now').setAttribute('cy',p.cy);$('#point-prev').setAttribute('cx',p.x);$('#point-prev').setAttribute('cy',p.py);$('#point-readout').innerHTML='<span class="current">本期 '+p.date+'<b>'+valueText(p.current,d)+' '+d.unit+'</b></span><span>上期 '+p.prevDate+'<b>'+valueText(p.previous,d)+' '+d.unit+'</b></span><span class="change '+changeClass(p.current,p.previous)+'">环比 '+changeText(p.current,p.previous)+'</span>';}
function groupName(r,dim){switch(dim){case'source':return sourceLabels()[sourceKey(r)];case'ip':return r.ip;case'channel':return analysisFixture.channels.find(c=>c.id===r.channel)?.name||null;case'slot':return analysisFixture.slots.find(s=>s.id===r.slot)?.name||null;default:return null;}}
function breakdownRows(){const dim=$('#dimension').value,key=selectedMetric,groups=new Map();for(const [period,rows] of [['current',model.current],['previous',model.previous]])for(const r of rows){const name=groupName(r,dim);if(!name)continue;if(!groups.has(name))groups.set(name,{name,current:0,previous:0});groups.get(name)[period]+=metricValue(r,key,model.phase);}return[...groups.values()].sort((a,b)=>b.current-a.current||a.name.localeCompare(b.name,'zh-CN'));}
function renderBreakdown(){const d=selectedDef(),dim=$('#dimension'),rows=breakdownRows();$('#breakdown-title').innerHTML=esc(metricTitle(d)+' · 按'+dim.selectedOptions[0].textContent+'拆分')+incomeHelp(d);$('#breakdown').innerHTML=rows.length?'<table><thead><tr><th>'+dim.selectedOptions[0].textContent+'</th><th class="num">本期</th><th class="num">上期</th><th class="num">增减额'+(d.unit==='单'?'（单）':'（元）')+'</th><th class="num">环比</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td class="num">'+valueText(r.current,d)+'</td><td class="num">'+valueText(r.previous,d)+'</td><td class="num">'+(r.current>r.previous?'+':'')+valueText(r.current-r.previous,d)+'</td><td class="num"><span class="change '+changeClass(r.current,r.previous)+'">'+changeText(r.current,r.previous)+'</span></td></tr>').join('')+'</tbody></table>':'<div class="empty">当前条件下暂无该维度数据</div>';}
function render(){const label=r=>r.replaceAll('-','.');$('#periods').innerHTML='<span><i class="dot"></i>本期 <b>'+label(model.start)+' — '+label(model.end)+'</b></span><span><i class="dot gray"></i>上期 <b>'+label(model.prevStart)+' — '+label(model.prevEnd)+'</b></span>';renderCards();renderChart();renderBreakdown();}
function populateSlots(){if(mode!=='channel')return;const select=$('#slot'),old=select.value,source=$('#source').value,allowed=analysisFixture.slots.filter(s=>analysisDaily.some(r=>r.slot===s.id&&accessible(r))&&(!source||s.type===source));select.innerHTML='<option value="">全部</option>'+allowed.map(s=>'<option value="'+s.id+'">'+s.name+'</option>').join('');select.disabled=source==='direct'||role==='second';if(role==='second')select.value='2001';else select.value=allowed.some(s=>String(s.id)===old)?old:'';if(source==='direct')select.value='';}
function setupScope(){const labels=sourceLabels();$('#source').innerHTML=(mode==='channel'&&role==='second'?'':'<option value="">全部</option>')+Object.entries(labels).map(([value,label])=>'<option value="'+value+'">'+label+'</option>').join('');$('#source').disabled=mode==='channel'&&role==='second';$('#ip').innerHTML='<option value="">全部</option>'+analysisFixture.ips.map(ip=>'<option>'+ip+'</option>').join('');if(mode==='admin'){$('#channel').disabled=false;$('#channel').innerHTML='<option value="">全部</option>'+analysisFixture.channels.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('');}else{$('#identity').textContent=roleDefs[role].name+' · '+roleDefs[role].title;$('#detail-link').href='../渠道订单收益与分级权限-V1.0/渠道订单收益与分级权限需求演示.html?role='+role;$('#slot').value='';populateSlots();}const dims=mode==='admin'?[['source','订单来源'],['ip','IP'],['channel','渠道']]:[['source','订单来源'],['ip','IP'],...(role==='second'?[]:[['slot','推广位']])];$('#dimension').innerHTML=dims.map(([v,l])=>'<option value="'+v+'">'+l+'</option>').join('');}
function setQuick(n){$('#end').value=analysisFixture.lastDay;$('#start').value=shift(analysisFixture.lastDay,1-n);document.querySelectorAll('[data-quick]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.quick)===n));apply();}
function reset(){setupScope();if($('#phase'))$('#phase').value='valid';selectedMetric=mode==='admin'?'orgNet':'own';setQuick(7);}
function prdTable(rows){return'<div class="table-wrap"><table><thead><tr><th>本次新增／改造</th><th>字段、计算与交互规则</th></tr></thead><tbody>'+rows.map(([a,b])=>'<tr><td>'+a+'</td><td>'+b+'</td></tr>').join('')+'</tbody></table></div>';}
function renderPrd(){const rows=[...(mode==='admin'?[['筛选区域吸顶（改造）','向下滚动至筛选区顶部距视口12px时，整个筛选卡吸顶，保留日期、筛选条件、查询重置及本期上期范围；向上回滚恢复原布局。白色背景及投影隔离下方图表，问号浮层显示在筛选卡上方。吸顶仅调整布局，不修改查询条件和统计口径。']]:[]),['订单分析入口（新增）','在本次'+(mode==='admin'?'业管':'渠道')+'订单明细版本的左侧“订单明细”下方增加订单分析入口。业管订单明细和分析可互相导航；本期仅推进业管侧订单分析，不提供渠道分析入口。'],['本期／上期日期（新增建议）','默认截至北京时间昨日的近7个完整自然日，可选近30天或自定义1～90天。上期取本期之前紧邻的等长区间，两期不重叠；例如10月28日至11月3日对比10月21日至27日。不是自然月同比或上月同期。明确展示两段日期；未完成当天不进入默认比较。'],['指标卡（新增建议）',mode==='admin'?'销售额、订单数、机构收入（保留短名称，以问号说明已扣达人、未扣渠道）、渠道提成和机构净收入。默认选中机构净收入。收入口径可切换预估／有效预估／结算，只作用于三个收入指标；销售额和订单数保持原订单口径。':'销售额、有效销售额、总订单数、有效订单数、预估总收益、预估净收益；默认预估净收益。三类机构保持原有两项收益名称和权限，二级两项相等。'],['机构收入问号说明（改造）','机构收入保留短名称，不增加“分配前”等后缀。指标卡、选中该指标后的趋势标题及贡献拆分标题旁增加问号；说明统一为“'+orgIncomeExplanation+'”。支持悬浮、聚焦及点击查看，关闭不修改筛选、指标选择或计算口径。说明随预估／有效预估／结算口径切换持续适用。'],['指标环比（新增建议）','当前指标汇总值与同一权限、同一筛选条件下的上期值比较，环比＝（本期－上期）÷上期。上期和本期均为0时为0%；上期0而本期非0时显示“—”，保留两期原值，不显示无穷百分比。金额保留两位小数，计算及汇总保留精度。'],['环比趋势图（新增建议）','点击指标卡切换图表指标，不改变筛选。实线为本期、虚线为上期，按周期内第几天对齐，横轴显示本期日期；悬停或键盘聚焦同时显示两期真实对应日期及数值。仅用单一指标／单位，不将订单数与金额混用一个纵轴；无订单日期补0。'],['筛选及权限（新增建议）',mode==='admin'?'支持订单来源（全部／平台达人／渠道达人）、IP、所属渠道及收入口径。平台达人来源下清空并禁用所属渠道；全部条件取交集，两期使用相同条件。':'支持本机构权限内的来源、IP、推广位。渠道看本渠道和全部下级，一级看本级及名下二级，二级仅本级且固定来源和推广位。机构之外的订单、收益和筛选候选不可返回。两期按历史授权订单结果统计，不按当前关系重算历史收益。'],['贡献拆分（新增建议）','显示当前选中指标的分组本期、上期、增减和环比，默认按本期值降序。'+(mode==='admin'?'可按订单来源、IP或渠道查看；渠道维度仅包含渠道来源。':'可按来源、IP或推广位查看；推广位维度不含本渠道直接来源；二级不提供推广位维度。')+'分组不重复计入同一条统计事实；范围受上方全部筛选控制。'],['日期校验与重置（新增建议）','开始日期不得晚于结束日期，日期不完整或超过90天时就地提示，保留上次有效结果。重置恢复近7天、全部可选来源与维度、默认指标；渠道角色固定范围保持不变。']];$('#prd-content').innerHTML='<h3>页面及指标规则</h3>'+prdTable(rows)+'<details open><summary>口径、数据与评审边界</summary><p>除业管侧新增菜单、环比趋势目标外，上述默认指标、等长周期比较、近7／30天、贡献拆分及筛选为本轮构思，尚待用户评审，不将原型默认值当作生产已确认规则。图表使用独立生成的模拟日汇总，未接真实历史订单，不能据此判断业务增长或渠道业绩。</p><p>业管销售额沿用当前明细总销售额演示的支付金额口径；渠道销售额、有效销售额继续用pay_goods_amount（预估参与结算金额），不改为支付金额。财务指标复用已确认收益含义；机构净收入不扣人力和工具等额外经营成本。渠道两项预估收益按原退款有效规则读取结果，不能再次扣服务费10%。当比较结算收入时，本期和上期订单的结算成熟度可能不同，不能仅凭差异认定业务能力变化；原型不新增预测、目标或自动归因结论。</p><p>数据不足、金额字段缺失、真实接口权限和跨月比例取值仍需接入时核实；本地原型未代表生产已完成。所有模拟数据与内部说明仅在评审工具栏和本PRD呈现，不加入正式业务文案。</p></details><details><summary>版本与来源</summary><p>2026-11-04用户要求在订单明细下增加订单分析，并确认业管、渠道两端都做。本目录单独交付，两端原订单明细仅新增导航和渠道角色回传。样式及字段语义依据本项目已确认的业管订单来源与净收入、渠道收益与分级权限版本；未更改订单资金算法。</p></details>';}
$('#filters').onsubmit=e=>{e.preventDefault();apply();};$('#reset').onclick=reset;
document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>setQuick(Number(b.dataset.quick)));
$('#filters').onchange=e=>{if(['start','end'].includes(e.target.id)){document.querySelectorAll('[data-quick]').forEach(b=>b.classList.remove('selected'));return;}if(e.target.id==='source'){if(mode==='channel')populateSlots();else{const disabled=e.target.value==='platform';$('#channel').disabled=disabled;if(disabled)$('#channel').value='';}}apply();};

$('#chart').addEventListener('pointermove',e=>{const hit=e.target.closest('[data-index]');if(hit)showPoint(Number(hit.dataset.index));});$('#chart').addEventListener('focusin',e=>{const hit=e.target.closest('[data-index]');if(hit)showPoint(Number(hit.dataset.index));});$('#chart').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const i=Math.max(0,Math.min(plotted.length-1,pointIndex+(e.key==='ArrowRight'?1:-1)));$('#chart [data-index="'+i+'"]').focus();});

const incomeTip=document.createElement('div');incomeTip.className='analysis-income-tooltip';incomeTip.id='analysis-income-tooltip';incomeTip.setAttribute('role','tooltip');incomeTip.textContent=orgIncomeExplanation;incomeTip.hidden=true;document.body.append(incomeTip);

document.addEventListener('focusin',e=>{const t=e.target.closest('[data-income-help]');if(t)showIncomeTip(t);else closeIncomeTip();});
