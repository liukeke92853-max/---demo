<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>展示配置</title>
<link rel="stylesheet" href="样式.css">
<style>[hidden]{display:none!important}.profile-panel,.profile-prd{max-width:1000px}.profile-panel{min-height:365px}.profile-row{display:flex;align-items:center;gap:24px;margin:24px 0}.profile-label{width:125px;flex-shrink:0;color:#586881}.profile-input{width:360px;max-width:100%;padding:10px;border:1px solid #d9e1ed;border-radius:5px}.profile-avatar{width:64px;height:64px;flex-shrink:0;border-radius:50%;object-fit:cover;background:#dce9fb}.tip{color:#8793a7;font-size:13px}.tag-new{color:#ed7927;font-size:11px;border:1px solid #ffbc84;border-radius:3px;padding:2px 4px}.switch-demo{padding:10px 16px;background:#edf3ff;border-radius:6px;margin-bottom:15px}.error{color:#d43e3e}.profile-actions{padding-left:149px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.profile-actions button{min-width:88px}.profile-value{font-size:16px;overflow-wrap:anywhere}.profile-message{min-height:22px;margin:12px 0 0 149px;font-size:13px}.profile-message.success{color:#278256}.avatar-placeholder{display:grid;place-items:center;color:#8ca2c4}.avatar-placeholder svg{width:38px;height:38px}.avatar-controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-width:0}.avatar-controls input{max-width:100%;font-size:13px}.primary .tag-new{background:white}.profile-input:focus{outline:2px solid #dce6ff;border-color:#2860ff}@media(max-width:680px){.profile-row{gap:12px;align-items:flex-start}.profile-label{width:100px;padding-top:8px}.profile-input{width:100%;min-width:0}.profile-actions{padding-left:112px}.profile-message{margin-left:112px}.profile-value{padding-top:8px}.switch-demo{font-size:12px}}</style>
</head>
<body>
<header class="app-header">
<div class="brand">
<b>切片工作台</b>
<span>渠道端</span>
</div>
<div class="account">
</div>
</header>
<nav class="sidebar">
<div class="nav-item">▤　订单明细</div>
<div class="nav-item">♡　邀约管理　⌃</div>
<div class="nav-child">邀约列表</div>
<div class="nav-child">账号列表</div>
<div class="nav-child selected">展示配置 <span class="tag-new">新增</span>
</div>
<a class="nav-child" href="../达人与渠道.html?view=channel" style="display:block;text-decoration:none">达人授权跟进</a>
<a class="nav-item" href="index.html" style="display:block;text-decoration:none">推广位管理</a>
<div class="nav-item">IP列表</div>
</nav>
<div class="content">
<div class="switch-demo">评审工具：<label>演示身份 <select id="role">
<option value="A">渠道 A</option>
<option value="P1">一级推广位</option>
<option value="P2">二级推广位</option>
</select>
</label>　<a href="../index.html">返回演示入口</a>
</div>
<section class="panel profile-panel">
<div class="heading">
<h2>展示配置 <span class="tag-new">新增</span>
</h2>
</div>
<p class="tip">达人通过邀约入口进入小程序时，将看到这里设置的名称和头像。</p>
<form id="profile-form" novalidate>
<div class="profile-row">
<label for="name" class="profile-label">展示名称 <span class="tag-new">新增</span>
</label>
<span id="name-view" class="profile-value">
</span>
<input class="profile-input" id="name" placeholder="请输入展示名称" aria-describedby="message" hidden disabled>
</div>
<div class="profile-row">
<label class="profile-label" for="file">展示头像 <span class="tag-new">新增</span>
</label>
<div class="avatar-controls">
<span id="avatar-placeholder" class="profile-avatar avatar-placeholder" role="img" aria-label="默认头像">
<svg viewBox="0 0 40 40" aria-hidden="true">
<circle cx="20" cy="13" r="8" fill="currentColor"/>
<path d="M5 36c0-9 6-14 15-14s15 5 15 14" fill="currentColor"/>
</svg>
</span>
<img id="preview" class="profile-avatar" alt="展示头像预览" hidden>
<input id="file" type="file" accept="image/*" hidden disabled>
</div>
</div>
<div class="profile-actions">
<button type="button" class="primary" id="edit">编辑 <span class="tag-new">新增</span>
</button>
<button type="submit" class="primary" id="save" hidden>保存 <span class="tag-new">新增</span>
</button>
<button type="button" id="cancel" hidden>取消 <span class="tag-new">新增</span>
</button>
</div>
<p id="message" class="profile-message" role="status" aria-live="polite">
</p>
</form>
</section>
<section class="panel profile-prd" data-display-prd aria-label="展示配置增量 PRD">
</section>
</div>
<script src="展示配置.js">
</script>
<script src="展示配置需求.js">
</script>
</body>
</html>
