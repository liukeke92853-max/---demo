<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>账号管理增量 PRD</title><style>body{max-width:960px;margin:50px auto;padding:0 20px;font:16px/1.8 sans-serif;color:#233653}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:12px;border-bottom:1px solid #e7edf4}th{background:#eff4fb}a{color:#285ff5}</style><a href="功能清单.html">← 返回功能清单</a><h1>账号管理增量 PRD</h1><p>渠道达人通用小程序 · 2026-11-18</p><table><tr><th>范围</th><th>改动</th></tr><tr><td>账号类型</td><td>仅展示抖音达人账号，移除快手达人、淘宝淘客等其他账号类型入口。</td></tr><tr><td>搜索与筛选</td><td>移除账号关键词搜索、最近授权排序、可升级账号、授权状态和运营人筛选。</td></tr><tr><td>账号卡片</td><td>移除进入抖音账号主页的跳转及右箭头；卡片内账号信息按现有展示。</td></tr><tr><td>新增抖音账号</td><td>保留入口，授权流程沿用既有能力，接入方式由研发核实。</td></tr></table><h2>验收</h2><p>账号管理只显示抖音达人账号及新增入口，无搜索和筛选；点击账号卡片不进入主页。</p></html>
