<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>渠道列表</title><style>*{box-sizing:border-box}body{margin:0;color:#273449;background:#f3f5f8;font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:#285eff;text-decoration:none}.review{background:#eaf7f1;color:#169463;font-size:11px;padding:2px 5px;border-radius:3px;margin-left:5px}.bar{height:38px;background:#182b4a;color:#d8e2f3;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.bar a{color:#cdddff}.head{height:74px;background:#fff;padding:20px 25px;font-size:22px;font-weight:700}.shell{display:flex;min-height:calc(100vh - 112px)}.rail{width:65px;background:white;border-right:1px solid #edf0f5;display:flex;flex-direction:column;align-items:center;gap:26px;padding-top:25px;color:#8090a7}.side{width:180px;flex:none;background:white;border-right:1px solid #edf0f5;padding:22px 0}.side strong,.side div{display:block;padding:14px 20px}.side strong{color:#285eff}.side .active{background:#f1f5ff;color:#245eff;border-right:3px solid #245eff;font-weight:bold}.content{flex:1;min-width:0;padding:22px}.box{background:white;border-radius:9px;padding:20px;margin-bottom:16px}.top{color:#285eff;font-size:16px;border-bottom:1px solid #ecf0f6;padding-bottom:15px}.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:16px}input,select{border:1px solid #d9e0eb;background:white;border-radius:4px;padding:9px;color:#54627a}.primary{border:0;background:#2f62ff;color:white;border-radius:4px;padding:9px 16px}.line{display:flex;align-items:center;justify-content:space-between}.wrap{overflow:auto}.tbl{width:100%;min-width:1100px;border-collapse:collapse;margin-top:20px}.tbl th,.tbl td{padding:15px 12px;border-bottom:1px solid #ecf0f5;text-align:left;white-space:nowrap}.tbl th{color:#65738a;background:#f6f8fc}.muted{font-size:12px;color:#929eb0;line-height:1.7}.switch{width:36px;height:21px;border:0;border-radius:20px;background:#c8d0db;padding:3px;vertical-align:middle}.switch::after{content:'';display:block;width:15px;height:15px;border-radius:50%;background:white}.switch.on{background:#3064ff}.switch.on::after{margin-left:15px}.ops button{border:0;background:none;color:#285eff;padding:4px}.help{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:1px solid #8c9bb1;border-radius:50%;color:#7d8ca4;font-size:11px;background:#fff;cursor:pointer}.help span{display:none;position:absolute;z-index:10;top:23px;left:50%;transform:translateX(-50%);width:250px;padding:10px 12px;background:#263b5b;color:white;border-radius:7px;white-space:normal;font-size:12px;line-height:1.5;box-shadow:0 6px 18px #132c4b33}.help:hover span,.help:focus span,.help.open span{display:block}.pager{text-align:right;padding-top:18px;color:#66758a}@media(max-width:700px){.rail{display:none}.side{width:132px}.content{padding:10px}}
</style></head><body><div class="bar"><span>渠道通用版 · 业管后台演示</span><a href="index.html">返回入口</a></div><div class="head">◢ 切片管理中心</div><div class="shell"><div class="rail"><span>数据</span><span>IP</span><a href="业管授权审核.html">KOC</a><span>商品</span><span>素材</span><span style="color:#285eff">合作</span><span>设置</span></div><aside class="side"><strong>渠道管理　⌃</strong><div class="active">渠道列表</div><div>邀约管理</div><div>渠道订单</div><div>渠道结算</div><strong style="color:#273449">工作室管理　⌃</strong><div>工作室列表</div></aside><div class="content"><section class="box"><div class="top"><span>渠道</span>　　<span style="color:#66758a">推广位</span></div><form class="filters" id="filter"><select aria-label="时间类型"><option>创建时间</option></select><input type="date" aria-label="开始日期"> — <input type="date" aria-label="结束日期"><span>合作状态</span><select id="status"><option>全部</option><option>合作中</option><option>已终止</option></select><input id="query" placeholder="机构ID / 机构名称 / 手机号"><button class="primary">筛选</button><button type="reset" id="reset">重置</button></form></section><section class="box"><div class="line"><b>数据列表</b><div><button onclick="tip()">提成档位配置</button>　<button onclick="tip()">提成修改审批</button>　<button class="primary" id="add">新增渠道</button></div></div><div class="wrap"><table class="tbl"><thead><tr><th>机构信息</th><th>合作状态</th><th>提成比例</th><th>达人端展示信息 <span class="review">新增</span></th><th>渠道保护期</th><th>邀约保护期</th><th>创建时间</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager" id="count"></div></section><p class="muted">依据用户提供的线上渠道列表截图还原，本次新增达人端展示信息。</p></div></div><script>
const channels=[{name:'渠道 A',id:'1536835',status:'合作中',protect:7,invite:7,created:'2026-11-01 00:00:00',updated:'2026-11-16 10:00:00'},{name:'渠道 B',id:'2746650',status:'合作中',protect:7,invite:7,created:'2026-11-02 00:00:00',updated:'2026-11-16 10:00:00'}];function render(){const q=document.querySelector('#query').value.trim(),st=document.querySelector('#status').value;const list=channels.filter(c=>(!q||c.name.includes(q)||c.id.includes(q))&&(st==='全部'||st===c.status));document.querySelector('#rows').innerHTML=list.map(c=>`<tr><td><b>${c.name}</b><div class="muted">机构ID ${c.id}</div></td><td><button class="switch on" aria-label="合作状态" disabled></button> ${c.status}</td><td>50%<div class="muted">自动匹配</div></td><td><div class="display-info" data-channel="${c.name}"></div></td><td>${c.protect}天</td><td>${c.invite}天</td><td>${c.created}</td><td>${c.updated}</td><td class="ops"><button onclick="tip()">编辑</button><button onclick="tip()">提成配置</button><button onclick="tip()">可申请的IP</button><button onclick="tip()">邀约详情</button></td></tr>`).join('')||'<tr><td colspan="9">暂无数据</td></tr>';document.querySelectorAll('.display-info').forEach(el=>{const info=el.dataset.channel==='渠道 A'?JSON.parse(localStorage.getItem('channelProfileA')||'{}'):{};el.textContent=info.name||'未配置';if(info.avatar){const img=document.createElement('img');img.src=info.avatar;img.alt='展示头像';img.style.cssText='width:32px;height:32px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px';el.prepend(img)}});document.querySelector('#count').textContent=`共 ${list.length} 条　 1　 20条/页`};function tip(){alert('该既有功能按线上规则执行，本次演示聚焦达人端展示信息。')}document.querySelector('#filter').onsubmit=e=>{e.preventDefault();render()};document.querySelector('#reset').onclick=()=>setTimeout(render);document.querySelector('#add').onclick=tip;window.addEventListener('storage',e=>{if(e.key==='channelProfileA')render()});render();</script></body></html>
