<body>

  <script>
    const screen = document.querySelector('#screen');
    const toast = document.querySelector('#toast');
    const state = { loggedIn:false, authenticated:false, inviter:new URLSearchParams(location.search).get('inviter')||'', scene:'home', needUid:true, ip:'小咖吃喝', hasSample:false, chosenIp:'小咖吃喝', selectedPartner:'', ipRejected:false, accountBound:false, settlementBound:false, ipSearch:'', partnerSearch:'', productPreviewIp:'小咖吃喝', productFilter:'全部', workSearch:'', workSort:'最新讲解' };
    const steps = (now=0) => `<div class="steps">${['提交资料','资料审核','合作准备'].map((x,i)=>`<div class="step ${i<now?'done':i===now?'now':''}">${x}</div>`).join('')}</div>`;
    const bindingSteps = (now=0) => `<div class="steps">${['提交信息','账号绑定','结算绑定'].map((x,i)=>`<div class="step ${i<now?'done':i===now?'now':''}">${x}</div>`).join('')}</div>`;
    const btn = (text, action, cls='primary') => `<button class="${cls}" data-action="${action}">${text}</button>`;
    const demoFlow = (text, action) => `<button class="demo-flow" data-action="${action}">演示流转：${text} ›</button>`;
    const notice = (text, type='blue') => `<div class="notice ${type}">${text}</div>`;
    const partnerAccounts=[{name:'小咖吃喝',fans:'粉丝 78.08w',icon:'咖'},{name:'好好生活',fans:'粉丝 19.18w',icon:'好'},{name:'COCO CHI...',fans:'粉丝 21.93w',icon:'C'},{name:'老琴私服（...',fans:'粉丝 78.08w',icon:'琴'},{name:'Dancy丹姐...',fans:'粉丝 19.18w',icon:'丹'},{name:'火火火火火...',fans:'粉丝 66.15w',icon:'火'},{name:'泡芙·美丽...',fans:'粉丝 30.05w',icon:'芙'},{name:'邹雪糕（9...',fans:'粉丝 6.94w',icon:'邹'},{name:'小个子切糕...',fans:'粉丝 259.13w',icon:'糕'},{name:'老马Marius',fans:'粉丝 40.98w',icon:'马'}];
    const partnerGrid=()=>{const keyword=state.partnerSearch.trim().toLowerCase(),matches=partnerAccounts.filter(item=>item.name.toLowerCase().includes(keyword));return `<div class="partner-grid">${matches.length?matches.map(item=>`<button class="partner-option ${state.selectedPartner===item.name?'selected':''}" data-action="select-partner" data-partner="${item.name}"><span class="partner-avatar">${item.icon}</span><span><b>${item.name}</b><small>${item.fans}</small></span>${state.selectedPartner===item.name?'<span class="partner-check">✓</span>':''}</button>`).join(''):'<div class="partner-empty">暂无匹配的合作达人</div>'}</div>`};
    const plazaIps=[{name:'小咖吃喝',title:'小咖吃喝（美食生活方式）',fans:'粉丝 78.08w　·　抖音',icon:'咖',tags:['需绑UID','高潜力IP'],metrics:[['分成比例','70%'],['商品平均佣金','15%'],['30日预计GMV','1000w+'],['30日直播场数','19']],bio:'达人简介：美食生活方式内容，适合口播、测评与好物分享类切片。',products:[{name:'轻食燕麦脆脆杯',commission:'18%',stock:true,color:'#dc9772',icon:'🥣'},{name:'气泡果汁礼盒',commission:'15%',stock:true,color:'#e6a1a8',icon:'🧃'},{name:'即食牛肉干',commission:'20%',stock:false,color:'#986f5a',icon:'🥩'},{name:'低脂拌饭酱',commission:'16%',stock:true,color:'#d4aa6b',icon:'🥫'},{name:'手冲咖啡组合',commission:'12%',stock:true,color:'#8e6d5e',icon:'☕'}]},{name:'好好生活',title:'好好生活（生活方式）',fans:'粉丝 19.18w　·　抖音',icon:'好',tags:['极高客单','秋冬爆款'],avatarStyle:'background:linear-gradient(135deg,#4d607e,#1e2b40)',metrics:[['分成比例','70%'],['商品平均佣金','12%'],['30日预计GMV','250w+'],['30日直播场数','7']],bio:'达人简介：质感生活好物分享，适合居家、收纳与日常美学类切片。',products:[{name:'北欧棉麻四件套',commission:'13%',stock:true,color:'#b4a080',icon:'🛏️'},{name:'香薰蜡烛礼盒',commission:'16%',stock:true,color:'#d6a1ae',icon:'🕯️'},{name:'原木收纳篮',commission:'10%',stock:false,color:'#b98d63',icon:'🧺'},{name:'轻奢玻璃花瓶',commission:'14%',stock:true,color:'#91a5b1',icon:'🏺'}]}];
    const ipMaterialLinks={'小咖吃喝':{type:'Excel',url:'https://example.com/小咖吃喝四件套素材.xlsx',name:'小咖吃喝四件套素材.xlsx'},'好好生活':{type:'网盘',url:'https://pan.example.com/好好生活四件套素材',name:'好好生活四件套素材'}};
    const materialLink=ip=>{const material=ipMaterialLinks[ip];return material?`<a class="textlink" href="${material.url}" target="_blank" rel="noreferrer">${material.type}：${material.name}　›</a>`:'<p class="hint">暂无四件套素材。</p>'};
    const fourPieceResources=ip=>`<div class="resource-card"><h3>修改教程</h3><div class="video-placeholder"><div><span>▶</span><small>视频教程占位</small></div></div></div><div class="resource-card"><h3>四件套素材模板</h3>${materialLink(ip)}</div><div class="resource-card"><h3>修改常见问题解答</h3><button class="poster-button" data-action="open-fourpiece-faq"><span>修改遇到问题？查看常见问题解答</span><span>›</span></button></div>`;
    const productThumbs=products=>`<span class="product-thumb-row">${products.slice(0,5).map(product=>`<span class="product-thumb" style="--product-color:${product.color}">${product.icon}</span>`).join('')}</span>`;
    const productPreview=()=>{const ip=plazaIps.find(item=>item.name===state.productPreviewIp)||plazaIps[0],filters=['全部','有库存','暂无库存'],products=state.productFilter==='全部'?ip.products:ip.products.filter(product=>state.productFilter==='有库存'?product.stock:!product.stock);return `<div class="product-page-head"><button data-action="home" aria-label="返回达人广场">‹</button><b>${ip.name}的货盘</b><span style="width:22px"></span></div><div class="product-page-meta"><span>商品佣金可见 · 数据定期同步</span><b>共 ${ip.products.length} 件</b></div><div class="product-filter">${filters.map(filter=>`<button class="${state.productFilter===filter?'active':''}" data-action="filter-products" data-filter="${filter}">${filter}</button>`).join('')}</div><div class="product-list">${products.length?products.map(product=>`<article class="product-card"><div class="product-cover" style="--product-color:${product.color}">${product.icon}</div><div class="product-copy"><b>${product.name}</b><span>佣金 ${product.commission}</span><small>${product.stock?'有库存':'暂无库存'}</small></div></article>`).join(''):'<div class="product-empty">当前筛选条件下暂无商品</div>'}</div>`};
    const plazaCard=item=>`<div class="plaza-ip-card"><div class="plaza-ip-top"><span class="plaza-ip-avatar" style="${item.avatarStyle||''}">${item.icon}</span><div class="plaza-ip-info"><b>${item.title}</b><small>${item.fans}</small></div><button class="plaza-apply" data-action="apply-cooperation" data-ip="${item.name}">申请合作</button></div><div class="plaza-tags">${item.tags.map(tag=>`<span>${tag}</span>`).join('')}</div>${item.metrics?`<div class="plaza-metrics">${item.metrics.map(([label,value])=>`<div><span>${label}</span><b>${value}</b></div>`).join('')}</div>`:''}${item.bio?`<div class="plaza-bio">${item.bio}</div>`:''}<button class="plaza-product-entrance" data-action="open-product-preview" data-ip="${item.name}">${productThumbs(item.products)}<b>等 ${item.products.length} 件商品</b><i>›</i></button></div>`;
    const plazaResults=()=>{const keyword=state.ipSearch.trim().toLowerCase(),matches=plazaIps.filter(item=>`${item.name}${item.title}`.toLowerCase().includes(keyword));return keyword&&!matches.length?`<div class="partner-empty">暂无匹配的合作达人，请更换关键词搜索</div>`:matches.map(plazaCard).join('')};
    const workData=[{name:'致知 十月桃 全羊毛慵懒简约百搭直筒长款半身裙',price:'790',stock:'183',total:'0–10',yesterday:'0–10',date:'2026/09/11 22:35',icon:'裙'},{name:'致知 眼儿媚 纯羊毛打底方领长袖上衣',price:'399',stock:'1050',total:'450–1000',yesterday:'0–10',date:'2026/08/03 16:15',icon:'衣'},{name:'致知 露盘 通勤质感白鸭绒羽绒衍缝马甲',price:'990',stock:'609',total:'200–450',yesterday:'0–10',date:'2026/10/12 10:00',icon:'衣'}];

settlement: () => `${bindingSteps(2)}<h2 class="screen-title">结算绑定</h2><p class="screen-desc">结算绑定沿用线上既有流程。</p><div class="card"><div class="row"><span>提交信息</span><span style="color:var(--green);font-weight:600">已完成</span></div><hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><div class="row"><span>账号绑定</span><span style="color:var(--green);font-weight:600">已完成</span></div><hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><div class="row"><span>结算绑定</span><span style="color:${state.settlementBound?'var(--green)':'var(--orange)'};font-weight:600">${state.settlementBound?'已完成':'进行中'}</span></div><p style="margin-top:10px">本期不改造字段、校验、状态回传及异常处理。</p></div>${state.settlementBound?demoFlow('完成结算绑定，进入四件套准备','material'):demoFlow('线上结算绑定完成','settlement-bound')}`,
uid: () => `${steps(2)}<div class="card status-card wait"><div class="row"><span class="state">待 UID 绑定</span><span class="meta">IP 需 UID 核验</span></div><p>四件套审核已通过，IP 方完成首次 UID 绑定后，运营确认通过，达人将进入“已合作”。</p></div><div class="timeline"><li class="on">账号与结算绑定完成</li><li class="on">四件套审核通过</li><li class="on">等待 UID 绑定确认</li><li>进入已合作</li></div>${demoFlow('UID绑定确认，进入已合作','active')}`,
        active: () => `${steps(3)}<div class="card status-card success"><div class="row"><span class="state">已合作</span><span style="color:var(--green);font-weight:600">✓ 可使用工作台</span></div><p>你已完成合作准备，可以开始使用工作台。</p></div>${btn('进入工作台','workbench')}`,
        rejected: () => `${steps(2)}<div class="card status-card wait"><div class="row"><span class="state">四件套需修改</span><span style="color:var(--red);font-weight:600">已驳回待修改</span></div><p>未按照 IP 要求修改四件套，请根据素材修改。</p></div>${fourPieceResources(state.chosenIp)}${demoFlow('达人提交修改，进入四件套复审','resubmit-four')}`,
        'fourpiece-faq': () => `<div class="blank-poster" aria-label="修改常见问题解答海报占位"></div>`,
        'ip-rejected': () => `<div class="card status-card wait"><div class="row"><span class="state">IP审核未通过</span></div><p>请查看审核结果。</p></div>`,
        'ip-reviewing': () => `${steps(1)}<div class="card status-card wait"><div class="row"><span class="state">IP信息审核中</span><span class="meta">待审核</span></div><p>新的意向 IP 已提交，请等待审核结果。</p></div>${demoFlow('IP审核通过，进入提交信息','demo-ip-pass')}${demoFlow('IP审核驳回，查看待修改','ip-rejected')}`,
'fourpiece-reviewing': () => `${steps(2)}<div class="card status-card wait"><div class="row"><span class="state">已提交四件套审核</span><span class="meta">待审核</span></div><p>请等待审核结果。</p></div>${demoFlow(`四件套审核通过，${state.needUid?'进入 UID 绑定':'进入已合作'}`,state.needUid?'uid':'active')}`,
        orders: () => `<iframe title="订单收益" src="订单收益页面.html" style="display:block;width:100%;height:670px;border:0;background:#f4f7fb"></iframe>`,
        accounts: () => `<div class="account-head"><button data-action="mine" aria-label="返回">‹</button><b>账号管理</b><span></span></div><div class="account-content"><div class="account-card"><div class="account-row"><span class="account-avatar">致</span><div><b>致知精致女装</b><p>粉丝 3241</p></div></div><div class="account-detail"><span>官方服务费率 <strong>10%</strong></span><span>11/09－12/08 适用</span></div></div></div><div class="account-bottom"><button data-action="add-account">新增抖音账号</button></div>`,
        mine: () => state.loggedIn?financePage('mine'):`<div class="profile-top"><div class="profile-line"><div class="guest-avatar" aria-label="空头像">♙</div><button class="guest-login" data-action="guest-login">请登录 › <span class="change-tag">新增</span></button></div></div>`,
        '我的钱包': () => financePage('我的钱包'),
        '收益台': () => financePage('收益台'),
        '收支明细': () => financePage('收支明细'),
        '收款账户': () => financePage('收款账户'),
        workbench: () => `<div class="wb-head"><span class="wb-avatar">致</span><b>致知官方旗舰店</b><button data-action="wb-ip" aria-label="选择合作达人">⌄</button></div><div class="wb-search-row"><label class="wb-search">⌕ <input id="wb-search" placeholder="请输入商品ID/链接/关键词" value="${state.workSearch}"></label><button data-action="wb-batch">⊕ 批量加橱窗</button></div><div class="wb-filters">${['最新讲解','最新上架','最新单场','销量排序','仅现货'].map(t=>`<button data-action="wb-sort" data-sort="${t}" class="${state.workSort===t?'on':''}">${t}${t==='销量排序'?' ▾':''}</button>`).join('')}<button data-action="wb-date" aria-label="选择日期">▦</button></div><div id="wb-products">${workProducts()}</div>`,
      };
      screen.innerHTML = (pages[state.scene] || pages.home)();
      document.querySelector('#channel-nav').style.display=state.scene==='accounts'?'none':'flex'; document.querySelector('#channel-nav').innerHTML=(state.loggedIn?[['home','达人广场'],['workbench','工作台'],['orders','订单收益'],['mine','我的']]:[['home','达人广场'],['mine','我的']]).map(([id,label])=>`<button data-action="${id}" class="${(state.scene===id||(id==='mine'&&['我的钱包','收益台','收支明细','收款账户'].includes(state.scene)))?'active':''}">${label}</button>`).join('');
      if(state.scene==='home'&&state.loggedIn){try{const inviter=state.inviter;const key=inviter==='P1'?'channelProfileP1':inviter==='P2'?'channelProfileP2':'channelProfileA';const info=JSON.parse(localStorage.getItem(key)||'{}');const name=document.querySelector('#inviter-name'),avatar=document.querySelector('#inviter-avatar');name.textContent=info.name||({P1:'一级推广位',P2:'二级推广位'}[inviter]||'渠道 A');if(info.avatar){const img=document.createElement('img');img.src=info.avatar;img.alt='邀请者头像';img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:50%';avatar.textContent='';avatar.appendChild(img)}}catch(e){}}
      const prompt=document.querySelector('#guest-prompt'); const guestVisible=!state.loggedIn&&['home','mine','product-preview'].includes(state.scene);prompt.hidden=!guestVisible;prompt.style.display=guestVisible?'flex':'none';prompt.innerHTML=guestVisible?'<span>登录后使用更多功能 <span class="change-tag">新增</span></span><button data-action="guest-login">立即登录</button>':'';
      renderPrd();
    }
    function go(scene) { if(!state.loggedIn&&!['home','mine','product-preview'].includes(scene)){guestLogin();return} state.scene=scene; render(); }
    function showNoInvitation(){const overlay=document.createElement('div');overlay.className='guest-mask';overlay.innerHTML='<div class="guest-dialog" role="dialog" aria-modal="true" aria-labelledby="no-invite-title"><h3 id="no-invite-title">暂无权限</h3><p>非邀约达人暂无权限使用，请扫邀约码后重试</p><div class="row"><button class="confirm" type="button">我知道了</button></div></div>';overlay.querySelector('.confirm').onclick=()=>overlay.remove();document.body.appendChild(overlay)}
    function guestLogin(){if(state.authenticated){if(!state.inviter){showNoInvitation();return}state.loggedIn=true;render();return}const overlay=document.createElement('div');overlay.className='guest-mask';overlay.innerHTML='<div class="guest-dialog" role="dialog" aria-modal="true"><h3>登录</h3><p>使用现有登录流程登录后继续。</p><div class="row"><button class="cancel" type="button">取消</button><button class="confirm" type="button">模拟登录成功</button></div></div>';overlay.querySelector('.cancel').onclick=()=>overlay.remove();overlay.querySelector('.confirm').onclick=()=>{overlay.remove();state.authenticated=true;if(!state.inviter){showNoInvitation();return}state.loggedIn=true;render()};document.body.appendChild(overlay)}
    document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;if(action==='guest-login'){e.preventDefault();e.stopImmediatePropagation();guestLogin();return}if(!state.loggedIn&&['apply-cooperation','view-progress','workbench','orders'].includes(action)){e.preventDefault();e.stopImmediatePropagation();guestLogin()}},true);
    const entrySelect=document.querySelector('#demo-inviter');entrySelect.value=['A','P1','P2'].includes(state.inviter)?state.inviter:'';entrySelect.addEventListener('change',e=>{state.inviter=e.target.value;state.loggedIn=!!state.authenticated&&!!state.inviter;state.scene='home';render()});document.querySelector('#demo-reset-guest').addEventListener('click',()=>{state.authenticated=false;state.loggedIn=false;state.scene='home';render()});
    document.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action!=='demo-ip-pass')return;e.preventDefault();e.stopImmediatePropagation();go('submit-info')},true);
    document.addEventListener('click', e => { const target=e.target.closest('[data-action]'); const action=target?.dataset.action; if(!action) return; if(action==='wb-sort'){state.workSort=target.dataset.sort;render();return} if(action==='wb-ip'||action==='wb-batch'||action==='wb-date'){showToast('现有操作入口，演示占位');return} if(action==='toggle-income'){incomeVisible=!incomeVisible;render();return} if(action==='mine-account'){go('accounts');return} if(action==='add-account'){showToast('新增抖音账号授权流程待接入');return} if(action==='mine-settings'){showToast('入口演示，具体页面待核实');return} if(action==='channel-material'){showToast('素材剪辑方案待研发评估');return} if(action==='copy-product'||action==='add-showcase'){showToast('演示操作');return} if(action==='open-product-preview'){state.productPreviewIp=target.dataset.ip||'小咖吃喝';state.productFilter='全部';go('product-preview');return} if(action==='filter-products'){state.productFilter=target.dataset.filter;render();return} if(action==='open-fourpiece-faq'){go('fourpiece-faq');return} if(action==='apply-cooperation'){state.ip=target.dataset.ip||'';state.chosenIp=state.ip;state.selectedPartner=state.ip;go('form');return} if(action==='view-progress'){go('progress');return} if(action==='select-partner'){state.selectedPartner=target.dataset.partner;render();showToast(`已选择合作达人：${state.selectedPartner}`);return} if(action==='view-authorized-account'){showToast('已打开可授权抖音号列表（演示）');return} if(action==='settlement-guide'){ showToast('已打开现有结算账户截图教程（演示）'); return; } if(action==='upload-sample'){ state.hasSample=true; render(); showToast('切片样片已上传（演示）'); return; } if(action==='demo-ip-pass'){go('material');return} if(action==='submit-fourpiece'||action==='resubmit-four'){go('fourpiece-reviewing');return} if(action==='submit-info-complete'){go('account-binding');return} if(action==='account-bound'){ state.accountBound=true; go('settlement'); return; } if(action==='settlement-bound'){ state.settlementBound=true; render(); return; } if(action==='submitted'){if(!partnerAccounts.some(item=>item.name===state.selectedPartner)){showToast('请选择一个合作达人');return}state.ip=state.selectedPartner;state.chosenIp=state.selectedPartner;localStorage.setItem('channelAuditStage','待审核');} go(action); });
    document.addEventListener('input',e=>{if(e.target.id==='wb-search'){state.workSearch=e.target.value;const results=document.querySelector('#wb-products');if(results)results.innerHTML=workProducts();return}if(e.target.id==='ip-search'){state.ipSearch=e.target.value;const results=document.querySelector('#plaza-results');if(results)results.innerHTML=plazaResults();return}if(e.target.id==='partner-search'){state.partnerSearch=e.target.value;const results=document.querySelector('#partner-results');if(results)results.innerHTML=partnerGrid();return}});
    document.querySelectorAll('.scene[data-scene]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.scene)));
    document.querySelector('#needUid').addEventListener('change',e=>{ state.needUid=e.target.checked; if(['fourpiece-reviewing','uid','active','binding'].includes(state.scene)) render(); });
    function showToast(text){ toast.textContent=text; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1600); }
    window.addEventListener('storage',e=>{if(['channelProfileA','channelProfileP1','channelProfileP2'].includes(e.key)&&state.scene==='home')render()});
    render();
  </script>
</body>
</html>
