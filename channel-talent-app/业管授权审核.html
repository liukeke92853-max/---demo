<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>业管授权审核</title><style>body{margin:0;background:#f2f4f8;font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#26344e}header{background:#152d50;color:white;padding:15px 25px}header a{color:white}main{display:flex}aside{width:190px;background:white;min-height:90vh;padding:24px;box-sizing:border-box}aside div{padding:15px 0;color:#3166ff}section{flex:1;padding:24px;min-width:0}.box{background:white;border-radius:10px;padding:22px;margin-bottom:16px}.nav{display:flex;gap:22px;overflow:auto}.nav button{white-space:nowrap;border:0;background:none;color:#77849a;padding:10px}.nav button.active{color:#3166ff;border-bottom:2px solid #3166ff}.filters{padding:20px 0;color:#93a0b1}.filters span{display:inline-block;border:1px solid #dce3ed;padding:10px 20px;margin-right:10px}table{width:100%;border-collapse:collapse}th,td{padding:15px;text-align:left;border-bottom:1px solid #edf1f6}th{background:#f4f7fb}button.action{border:0;background:none;color:#2c61f1;cursor:pointer}.tag{background:#eaf7f1;color:#139a68;font-size:11px;padding:2px 4px;border-radius:4px}a{color:#3166ff}.note{color:#6f7d93;margin-top:18px}</style><header>切片管理中心　·　业管授权审核演示　 <a href="index.html">返回入口</a></header><main><aside><b>授权管理</b><div>自主绑定 KOC</div><a href="业管渠道列表.html">渠道列表</a></aside><section><div class="box"><div class="nav" id="tabs"></div><div class="filters"><span>申请时间　开始日期　—　结束日期</span><span>KOC 信息</span><span>IP 信息</span></div></div><div class="box"><b>数据列表</b><table><thead><tr><th>KOC信息</th><th>IP信息</th><th>审核状态</th><th>所属导师</th><th>渠道信息</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><p class="note">渠道达人初审通过后直接进入 IP 审核的待审核；平台达人的既有流程不变。</p></div></section></main><script>let current='待审核',stage='待审核';const names=['待审核','待分配导师','IP审核','待绑定','已绑定','已合作','待清退','待确认解绑','已解绑'];function render(){document.querySelector('#tabs').innerHTML=names.map(t=>`<button class="${current===t?'active':''}" onclick="current='${t}';render()">${t}</button>`).join('');const here=(stage==='待审核'&&current==='待审核')||(stage==='IP待审核'&&current==='IP审核')||(stage==='待绑定'&&current==='待绑定');document.querySelector('#rows').innerHTML=here?`<tr><td>小林</td><td>潮酷穿搭</td><td>${stage==='IP待审核'?'待审核 <span class="tag">改造</span>':stage}</td><td>—</td><td>渠道 A</td><td>${stage==='待绑定'?'—':`<button class="action" onclick="pass()">通过</button>`}</td></tr>`:'<tr><td colspan="6">暂无数据</td></tr>'}function pass(){if(stage==='待审核'){stage='IP待审核';current='IP审核';localStorage.setItem('channelAuditStage','待审核')}else if(stage==='IP待审核'){stage='待绑定';current='待绑定';localStorage.setItem('channelAuditStage','待绑定')}render()}render();</script></html>
